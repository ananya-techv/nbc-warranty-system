<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}NBC Warranty System{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --nbc-blue: #0a2559;
            --nbc-blue-light: #123a7a;
            --nbc-yellow: #f5b700;
            --nbc-white: #ffffff;
        }
        body { background-color: #f4f5f8; }
        .navbar { background-color: var(--nbc-blue) !important; }
        .navbar-brand { font-weight: 700; color: var(--nbc-yellow) !important; letter-spacing: 0.5px; }
        .nav-link { color: #dfe6f5 !important; }
        .nav-link:hover { color: var(--nbc-yellow) !important; }
        .btn-primary { background-color: var(--nbc-blue); border-color: var(--nbc-blue); }
        .btn-primary:hover { background-color: var(--nbc-blue-light); border-color: var(--nbc-blue-light); }
        .btn-accent { background-color: var(--nbc-yellow); border-color: var(--nbc-yellow); color: var(--nbc-blue); font-weight: 600; }
        .btn-accent:hover { background-color: #e0a800; color: var(--nbc-blue); }
        .card { border: none; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
        .badge.bg-primary { background-color: var(--nbc-blue) !important; }
        .certificate-box {
            border: 3px solid var(--nbc-blue);
            border-radius: 10px;
            background: #fff;
            padding: 2.5rem;
        }
        .accent-bar { height: 5px; background: linear-gradient(90deg, var(--nbc-blue), var(--nbc-yellow)); }
    </style>
</head>
<body>
    <div class="accent-bar"></div>
    <nav class="navbar navbar-expand-lg mb-4">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('home') }}">NBC WARRANTY SYSTEM</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{{ url_for('home') }}">Home</a>
                {% if session.get('mechanic_id') %}
                    <a class="nav-link" href="{{ url_for('install_page') }}">New Installation</a>
                    <span class="nav-link">Hi, {{ session['mechanic_name'] }}</span>
                    <a class="nav-link" href="{{ url_for('logout') }}">Logout</a>
                {% else %}
                    <a class="nav-link" href="{{ url_for('mechanic_login') }}">Mechanic Login</a>
                {% endif %}
                {% if session.get('is_admin') %}
                    <a class="nav-link" href="{{ url_for('dashboard') }}">Dashboard</a>
                    <a class="nav-link" href="{{ url_for('mechanics_page') }}">Mechanics</a>
                    <a class="nav-link" href="{{ url_for('logout') }}">Logout (Admin)</a>
                {% else %}
                    <a class="nav-link" href="{{ url_for('admin_login') }}">Admin Login</a>
                {% endif %}
            </div>
        </div>
    </nav>
    <div class="container pb-5">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
