<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}NBC Warranty System{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
    <div class="accent-bar"></div>
    <nav class="navbar navbar-expand-lg mb-4">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('home') }}">NBC WARRANTY SYSTEM</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{{ url_for('home') }}">Home</a>
                {% if session.get('mechanic_id') %}
                    <a class="nav-link" href="{{ url_for('install_page') }}">New Installation</a>
                    <span class="nav-link">Hi, {{ session['mechanic_name'] }}</span>
                    <a class="nav-link" href="{{ url_for('logout') }}">Logout</a>
                {% else %}
                    <a class="nav-link" href="{{ url_for('mechanic_login') }}">Mechanic Login</a>
                {% endif %}
                {% if session.get('is_admin') %}
                    <a class="nav-link" href="{{ url_for('dashboard') }}">Dashboard</a>
                    <a class="nav-link" href="{{ url_for('mechanics_page') }}">Mechanics</a>
                    <a class="nav-link" href="{{ url_for('logout') }}">Logout (Admin)</a>
                {% else %}
                    <a class="nav-link" href="{{ url_for('admin_login') }}">Admin Login</a>
                {% endif %}
            </div>
        </div>
    </nav>
    <div class="container pb-5">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
