{% extends 'base.html' %}
{% block title %}New Installation{% endblock %}
{% block content %}
<h2 class="mb-4">New Bearing Installation</h2>

<div class="card p-4" style="max-width: 600px;">
    <div class="mb-3">
        <label class="form-label">Mechanic</label>
        <input type="text" class="form-control" value="{{ mechanic_name }}" disabled>
        <div class="form-text">Auto-filled from your login - no need to select it.</div>
    </div>

    <div class="mb-3">
        <label class="form-label">Bearing Code</label>
        <input type="text" id="bearingCode" class="form-control" placeholder="e.g. NBC-6205-2RS-00123">
        <div id="verifyMessage" class="form-text"></div>
    </div>

    <div class="mb-3">
        <label class="form-label">Installation Location</label>
        <input type="text" id="location" class="form-control" placeholder="e.g. Patna Workshop">
    </div>

    <button id="submitBtn" class="btn btn-accent" disabled>Complete Installation</button>
    <div id="resultMessage" class="mt-3"></div>
</div>

<script src="{{ url_for('static', filename='js/install.js') }}"></script>
{% endblock %}
