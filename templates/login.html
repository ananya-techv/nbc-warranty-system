{% extends 'base.html' %}
{% block title %}{{ role }} Login{% endblock %}
{% block content %}
<div class="card p-4 mx-auto" style="max-width: 420px;">
    <h4 class="mb-3">{{ role }} Login</h4>

    {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Log In</button>
    </form>

    {% if role == 'Mechanic' %}
    <div class="form-text mt-3">Demo credentials: rajesh / pass123</div>
    {% else %}
    <div class="form-text mt-3">Demo credentials: admin / admin123</div>
    {% endif %}
</div>
{% endblock %}
